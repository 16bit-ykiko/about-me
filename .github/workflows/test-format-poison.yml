name: test format poison

on: workflow_dispatch

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Create env
        run: |
          cat > pixi.toml << 'TOML'
          [workspace]
          name = "test"
          channels = ["conda-forge"]
          platforms = ["osx-arm64"]
          [dependencies]
          clang = "==22.1.8"
          clangxx = "==22.1.8"
          lld = "==22.1.8"
          libcxx = "==22.1.8"
          libcxx-devel = "==22.1.8"
          TOML
          pixi install
          pixi run clang++ --version

      - name: Write repro
        run: |
          cat > tmpl.h << 'CPP'
          #pragma once
          #include <format>
          #include <string>
          #include <string_view>
          template <class T>
          std::string usage(const T& v) {
              return std::format("{} {}", std::string("x"), std::string_view(v));
          }
          template <class T>
          std::string usage_vfmt(const T& v) {
              return std::vformat("{} {}", std::make_format_args("x", v));
          }
          CPP
          cat > wrap_std.cppm << 'CPP'
          module;
          #include <format>
          #include <string>
          #include <string_view>
          export module wrap_std;
          export namespace std { using ::std::string; using ::std::string_view; using ::std::format; using ::std::format_string; using ::std::vformat; using ::std::make_format_args; }
          CPP
          cat > wrap_kota.cppm << 'CPP'
          module;
          #include "tmpl.h"
          export module wrap_kota;
          export using ::usage;
          export using ::usage_vfmt;
          CPP
          cat > app.cppm << 'CPP'
          module;
          #include <string>
          export module app;
          import wrap_std;
          import wrap_kota;
          export std::string run();
          CPP
          cat > app_impl.cpp << 'CPP'
          module app;
          std::string run() { return usage(std::string("y")); }
          CPP
          cat > app_impl_vfmt.cpp << 'CPP'
          module app;
          std::string run() { return usage_vfmt(std::string("y")); }
          CPP

      - name: Run variants
        run: |
          v() { pixi run clang++ -std=c++23 -stdlib=libc++ -fno-modules-reduced-bmi "$@"; }
          run_variant() {
            name=$1; shift
            if "$@" > /tmp/$name.log 2>&1; then echo "VERDICT $name: PASS"; else echo "VERDICT $name: FAIL"; tail -6 /tmp/$name.log; fi
          }
          v --precompile wrap_std.cppm -o wrap_std.pcm
          v --precompile wrap_kota.cppm -o wrap_kota.pcm
          v --precompile app.cppm -fmodule-file=wrap_std=wrap_std.pcm -fmodule-file=wrap_kota=wrap_kota.pcm -o app.pcm
          MF="-fmodule-file=wrap_std=wrap_std.pcm -fmodule-file=wrap_kota=wrap_kota.pcm -fmodule-file=app=app.pcm"
          run_variant v1_dual_gmf_impl v $MF -c app_impl.cpp -o /tmp/t1.o
          run_variant v2_vfmt_surgery v $MF -c app_impl_vfmt.cpp -o /tmp/t2.o
          echo done
