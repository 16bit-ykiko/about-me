name: test hash_memory

on: workflow_dispatch

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: native
          - os: macos-15
            arch: x64-cross
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install conda clang 22
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Setup pixi env
        run: |
          cat > pixi.toml << 'TOML'
          [workspace]
          name = "test"
          channels = ["conda-forge"]
          platforms = ["osx-arm64"]
          [dependencies]
          clang = "==22.1.8"
          clangxx = "==22.1.8"
          lld = "==22.1.8"
          TOML
          pixi install

      - name: Write test file
        run: |
          cat > test.cpp << 'CPP'
          #include <string>
          #include <unordered_map>
          int main() {
              std::unordered_map<std::string, int> m;
              m["hello"] = 1;
              return m.size();
          }
          CPP

      - name: Conda clang WITHOUT annotation
        run: |
          echo "=== Conda clang, no annotation ==="
          pixi run clang++ -std=c++23 -c test.cpp -o test1.o
          nm test1.o | grep -i hash_memory && echo "REFERENCES __hash_memory" || echo "NO reference"

      - name: Conda clang WITH vendor annotation
        run: |
          echo "=== Conda clang, with annotation ==="
          pixi run clang++ -std=c++23 -D_LIBCPP_HAS_VENDOR_AVAILABILITY_ANNOTATIONS=1 -c test.cpp -o test2.o
          nm test2.o | grep -i hash_memory && echo "REFERENCES __hash_memory" || echo "NO reference"

      - name: Conda clang x64 cross WITHOUT annotation
        if: matrix.arch == 'x64-cross'
        run: |
          echo "=== Conda clang x64 cross, no annotation ==="
          pixi run clang++ -std=c++23 -target x86_64-apple-darwin -c test.cpp -o test3.o
          nm test3.o | grep -i hash_memory && echo "REFERENCES __hash_memory" || echo "NO reference"

      - name: Conda clang x64 cross WITH annotation
        if: matrix.arch == 'x64-cross'
        run: |
          echo "=== Conda clang x64 cross, with annotation ==="
          pixi run clang++ -std=c++23 -target x86_64-apple-darwin -D_LIBCPP_HAS_VENDOR_AVAILABILITY_ANNOTATIONS=1 -c test.cpp -o test4.o
          nm test4.o | grep -i hash_memory && echo "REFERENCES __hash_memory" || echo "NO reference"

      - name: Check macros
        run: |
          echo "=== Default macros ==="
          pixi run clang++ -dM -E -x c++ /dev/null 2>/dev/null | grep -i "MAC_OS_X_VERSION\|ENVIRONMENT\|LIBCPP_INTRODUCED\|AVAILABILITY_HAS_HASH" || true
          echo "=== With annotation ==="
          pixi run clang++ -D_LIBCPP_HAS_VENDOR_AVAILABILITY_ANNOTATIONS=1 -dM -E -x c++ /dev/null 2>/dev/null | grep -i "MAC_OS_X_VERSION\|ENVIRONMENT\|LIBCPP_INTRODUCED\|AVAILABILITY_HAS_HASH" || true
