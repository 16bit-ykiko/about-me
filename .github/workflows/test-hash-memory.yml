name: test hash_memory

on: workflow_dispatch

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Create env
        run: |
          cat > pixi.toml << 'TOML'
          [workspace]
          name = "test"
          channels = ["conda-forge"]
          platforms = ["osx-arm64"]
          [dependencies]
          clang = "==22.1.8"
          clangxx = "==22.1.8"
          lld = "==22.1.8"
          TOML
          pixi install

      - name: Write test
        run: |
          cat > test.cpp << 'CPP'
          #include <string>
          #include <unordered_map>
          int main() {
              std::unordered_map<std::string, int> m;
              m["hello"] = 1;
              return m.size();
          }
          CPP

      - name: Check undefined symbols (the real test)
        run: |
          echo "=== WITHOUT annotation ==="
          pixi run clang++ -std=c++23 -c test.cpp -o no_anno.o
          echo "Undefined hash_memory refs:"
          nm -u no_anno.o | grep -i hash_memory || echo "(none)"
          echo "Defined hash_memory:"
          nm no_anno.o | grep -i "T.*hash_memory" || echo "(none)"

          echo ""
          echo "=== WITH annotation ==="
          pixi run clang++ -std=c++23 -D_LIBCPP_HAS_VENDOR_AVAILABILITY_ANNOTATIONS=1 -c test.cpp -o anno.o
          echo "Undefined hash_memory refs:"
          nm -u anno.o | grep -i hash_memory || echo "(none)"
          echo "Defined hash_memory:"
          nm anno.o | grep -i "T.*hash_memory" || echo "(none)"

          echo ""
          echo "=== x64 cross WITHOUT annotation ==="
          pixi run clang++ -std=c++23 -target x86_64-apple-darwin -c test.cpp -o x64_no.o
          echo "Undefined hash_memory refs:"
          nm -u x64_no.o | grep -i hash_memory || echo "(none)"

          echo ""
          echo "=== x64 cross WITH annotation ==="
          pixi run clang++ -std=c++23 -target x86_64-apple-darwin -D_LIBCPP_HAS_VENDOR_AVAILABILITY_ANNOTATIONS=1 -c test.cpp -o x64_anno.o
          echo "Undefined hash_memory refs:"
          nm -u x64_anno.o | grep -i hash_memory || echo "(none)"
